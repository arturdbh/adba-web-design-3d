name: Desplegar al Subdominio
on:
  push:
    branches:
      - main
jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Obtener codigo mas reciente
      uses: actions/checkout@v3
    
    - name: Sincronizar archivos por FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: public_html/web/ # <--- ¡REVISA ESTO! Cambia "3d" por el nombre exacto de la carpeta de tu subdominio
